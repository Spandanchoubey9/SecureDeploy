services:
  postgres:
    image: postgres:16
    container_name: securedeploy-aws-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - securedeploy_aws_postgres_data:/var/lib/postgresql/data
    networks:
      - securedeploy-aws-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securedeploy-aws-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JENKINS_URL: ${JENKINS_URL}
      JENKINS_JOB_NAME: ${JENKINS_JOB_NAME}
      JENKINS_USERNAME: ${JENKINS_USERNAME}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN}
      JENKINS_CALLBACK_SECRET: ${JENKINS_CALLBACK_SECRET}
      PORT: 5000
    expose:
      - "5000"
    networks:
      - securedeploy-aws-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securedeploy-aws-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - securedeploy-aws-network
    depends_on:
      - backend

networks:
  securedeploy-aws-network:
    driver: bridge

volumes:
  securedeploy_aws_postgres_data:
