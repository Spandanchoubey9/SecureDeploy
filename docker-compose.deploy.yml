services:

  backend:
    image: securedeploy-backend:${BUILD_NUMBER}

    container_name: securedeploy-backend
    restart: unless-stopped

    ports:
      - "5001:5000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000

    networks:
      - securedeploy-network

    depends_on:
      - postgres


  frontend:
    image: securedeploy-frontend:${BUILD_NUMBER}

    container_name: securedeploy-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    networks:
      - securedeploy-network

    depends_on:
      - backend


  postgres:
    image: postgres:16

    container_name: securedeploy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - securedeploy-network


networks:
  securedeploy-network:
    driver: bridge


volumes:
  postgres_data: