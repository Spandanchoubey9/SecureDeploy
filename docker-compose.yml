services:

  postgres:
    image: postgres:16
    container_name: securedeploy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - securedeploy-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: securedeploy-backend
    restart: unless-stopped

    ports:
      - "5001:5000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      JENKINS_URL: http://host.docker.internal:8080
      JENKINS_JOB_NAME: SecureDeploy-CI-CD
      JENKINS_USERNAME: spandan
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN}
      JENKINS_CALLBACK_SECRET: ${JENKINS_CALLBACK_SECRET}

    depends_on:
      - postgres

    networks:
      - securedeploy-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: securedeploy-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - securedeploy-network


networks:
  securedeploy-network:
    driver: bridge


volumes:
  postgres_data: